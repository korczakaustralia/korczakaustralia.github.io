# Keeps the "Latest Updates" block on news.html in step with the published Google Doc.
# Runs every 30 minutes, on every push, and on demand (Actions tab -> "Sync news from Google Doc" -> Run workflow).
name: Sync news from Google Doc

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/sync_news.py']

permissions:
  contents: write

concurrency:
  group: sync-news
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install beautifulsoup4

      - name: Rebuild the Latest Updates block
        run: python3 scripts/sync_news.py

      - name: Commit if anything changed
        run: |
          git config user.name  "news-sync[bot]"
          git config user.email "news-sync@users.noreply.github.com"
          git add news.html assets/images/updates
          if git diff --cached --quiet; then
            echo "No change in the Google Doc."
          else
            git commit -m "News: update from Google Doc"
            git push
          fi
